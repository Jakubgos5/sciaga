:root[data-theme="dark"]{--bg:#0d1917;--panel:#14241f;--ink:#e3f1ec;--mute:#93aaa2;--line:#25403a;--code:#07110f;--codeink:#c9efe1;--acc:#4fd1b8;--accsoft:#1c3a33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 "Source Sans 3",system-ui,sans-serif}
header{max-width:1000px;margin:0 auto;padding:36px 20px 8px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-top:18px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.bar div{max-width:1000px;margin:0 auto;padding:10px 20px;display:flex;gap:8px;overflow-x:auto}
.bar button{flex:none;font:600 15px "Source Sans 3",sans-serif;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{max-width:1000px;margin:0 auto;padding:20px}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;margin-bottom:8px}
h2{font:700 28px "Bricolage Grotesque",sans-serif;margin:28px 0 4px}
.intro{color:var(--mute);margin:0 0 14px}
article{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:0 0 14px;overflow:hidden}
.wrap{position:relative}
.code{background:var(--code);color:var(--codeink);margin:0;padding:14px 76px 14px 16px;font:400 15px/1.55 "Fira Code",ui-monospace,monospace;white-space:pre;overflow-x:auto}
.copy{position:absolute;top:8px;right:8px;font:600 13px "Source Sans 3",sans-serif;padding:4px 10px;border-radius:6px;border:1px solid #3b6159;background:transparent;color:var(--codeink);cursor:pointer}
.txt{padding:12px 16px 14px}
.tr{display:inline-block;background:var(--accsoft);color:var(--ink);font-weight:600;font-size:15px;padding:2px 10px;border-radius:6px;margin-bottom:6px}
.txt p{margin:0}
.empty{color:var(--mute);padding:24px 0}
footer{max-width:1000px;margin:0 auto;padding:10px 20px 40px;color:var(--mute);font-size:15px}

X.forEach(function(a,i){a.forEach(function(r){L[i].c.push(r)})});
var cur=0,tabs=document.getElementById("tabs"),list=document.getElementById("list"),q=document.getElementById("q");
function mk(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function render(){
  var d=L[cur],s=q.value.trim().toLowerCase(),n=0;
  document.getElementById("title").textContent=d.n;
  document.getElementById("intro").textContent=d.i;
  list.textContent="";
  d.c.forEach(function(r){
    if(s&&(r.join(" ").toLowerCase().indexOf(s)<0))return;
    n++;
    var a=mk("article"),pre=mk("pre","code",r[0]),b=mk("button","copy","Kopiuj");
    b.type="button";
    b.onclick=function(){
      var done=function(){b.textContent="Skopiowano";setTimeout(function(){b.textContent="Kopiuj"},1200)};
      var fb=function(){var x=document.createElement("textarea");x.value=r[0];x.style.position="fixed";x.style.opacity="0";document.body.appendChild(x);x.select();try{document.execCommand("copy");done()}catch(e){b.textContent="Błąd"}document.body.removeChild(x)};
      try{navigator.clipboard.writeText(r[0]).then(done,fb)}catch(e){fb()}
    };
    var w=mk("div","wrap");w.appendChild(pre);w.appendChild(b);
    var t=mk("div","txt");
    t.appendChild(mk("div","tr",r[1]));
    t.appendChild(mk("p",null,r[2]));
    a.appendChild(w);a.appendChild(t);list.appendChild(a);
  });
  if(!n)list.appendChild(mk("p","empty","Brak wyników. Spróbuj innego słowa."));
}
L.forEach(function(d,i){
  var b=mk("button",null,d.n);b.type="button";
  b.setAttribute("aria-pressed",i===0);
  b.onclick=function(){
    cur=i;
    Array.prototype.forEach.call(tabs.children,function(x,j){x.setAttribute("aria-pressed",j===i)});
    render();
  };
  tabs.appendChild(b);
});
q.addEventListener("input",render);
render();
</script>
